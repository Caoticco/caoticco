<section class="login-card">

    <!-- MARCA -->

    <div class="brand">

        <span class="brand-line"></span>

        CAOTICCO

        <span class="brand-line"></span>

    </div>

    <!-- TITULO -->

    <header>

        <p class="eyebrow">
            Bienvenido de nuevo
        </p>

        <h1 class="title display">
            INICIAR<br>
            SESIÓN
        </h1>

        <p class="description">
            Accede a tu cuenta para continuar
            dentro de CAOTICCO.
        </p>

    </header>

    <!-- MENSAJE -->

    <div
        id="message"
        class="message"
        role="alert"
    ></div>

    <!-- LOGIN -->

    <form
        id="loginForm"
        class="login-form"
    >

        <div class="field">

            <label for="email">
                Correo electrónico
            </label>

            <input
                class="input"
                type="email"
                id="email"
                name="email"
                placeholder="tu@email.com"
                autocomplete="email"
                required
            >

        </div>

        <div class="field">

            <label for="password">
                Contraseña
            </label>

            <input
                class="input"
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
            >

        </div>

        <div class="options">

            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                    name="recordarme"
                >

                Recordarme

            </label>

            <a
                href="#"
                class="forgot"
                id="forgotPassword"
            >
                ¿Olvidaste tu contraseña?
            </a>

        </div>

        <!-- BOTÓN LOGIN -->

        <button
            type="submit"
            class="button"
        >
            INICIAR SESIÓN
            <span>→</span>
        </button>

    </form>

    <!-- REGISTRO -->

    <div class="register-area">

        <p class="register-text">
            ¿Todavía no tienes una cuenta?
        </p>

        <a
            href="registro.html"
            class="register-button"
        >
            CREAR UNA CUENTA
        </a>

    </div>

    <!-- VOLVER -->

    <a
        href="index.html"
        class="back"
    >
        ← Volver a CAOTICCO
    </a>

</section>
