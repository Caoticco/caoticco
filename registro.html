<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear cuenta | CAÓTICCO</title>

  <!-- TIPOGRAFÍAS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       ESTILO GENERAL
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #080707;

      font-family: "Work Sans", sans-serif;
      color: #f4f0eb;
    }

    /* =========================
       CAJA DE REGISTRO
    ========================= */

    .register-box {
      width: 100%;
      max-width: 520px;

      margin: 30px;
      padding: 45px 40px;

      background: #151111;

      border: 1px solid rgba(244, 240, 235, 0.15);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.6);
    }

    /* Línea CAÓTICCO */

    .brand-line {
      width: 45px;
      height: 3px;

      margin-bottom: 18px;

      background: #a42b31;
    }

    /* =========================
       TEXTOS
    ========================= */

    .eyebrow {
      margin-bottom: 8px;

      color: #a42b31;

      font-family: "Barlow Condensed", sans-serif;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .title {
      margin-bottom: 15px;

      font-family: "Barlow Condensed", sans-serif;

      font-size: 48px;
      font-weight: 700;

      line-height: 0.95;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .description {
      margin-bottom: 30px;

      color: rgba(244, 240, 235, 0.6);

      font-size: 14px;

      line-height: 1.7;
    }

    /* =========================
       FORMULARIO
    ========================= */

    .register-form {
      display: flex;

      flex-direction: column;

      gap: 18px;
    }

    .form-row {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 15px;
    }

    .form-field {
      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .form-field label {
      color: #f4f0eb;

      font-size: 12px;

      font-weight: 600;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    /* =========================
       INPUTS
    ========================= */

    .input-wrapper {
      position: relative;

      width: 100%;
    }

    .input-wrapper input {
      width: 100%;
      height: 50px;

      padding: 0 15px;

      background: #080707;

      border: 1px solid rgba(244, 240, 235, 0.15);

      outline: none;

      color: #f4f0eb;

      font-family: "Work Sans", sans-serif;

      font-size: 14px;

      transition: 0.25s ease;
    }

    .input-wrapper input::placeholder {
      color: rgba(244, 240, 235, 0.35);
    }

    .input-wrapper input:focus {
      border-color: #a42b31;

      box-shadow:
        0 0 0 1px rgba(164, 43, 49, 0.2);
    }

    /* =========================
       BOTÓN VER CONTRASEÑA
    ========================= */

    .password-toggle {
      position: absolute;

      top: 50%;
      right: 12px;

      transform: translateY(-50%);

      background: transparent;

      border: none;

      color: rgba(244, 240, 235, 0.5);

      font-size: 11px;

      cursor: pointer;
    }

    .password-toggle:hover {
      color: #a42b31;
    }

    /* =========================
       CHECKBOX
    ========================= */

    .terms {
      display: flex;

      align-items: flex-start;

      gap: 10px;

      margin-top: 3px;
    }

    .terms input {
      width: 17px;
      height: 17px;

      margin-top: 2px;

      accent-color: #a42b31;

      cursor: pointer;
    }

    .terms label {
      color: rgba(244, 240, 235, 0.6);

      font-size: 12px;

      line-height: 1.5;

      cursor: pointer;
    }

    /* =========================
       BOTÓN CREAR CUENTA
    ========================= */

    .register-button {
      width: 100%;
      height: 52px;

      margin-top: 5px;

      background: #761d22;

      border: 1px solid #a42b31;

      color: #f4f0eb;

      font-family: "Barlow Condensed", sans-serif;

      font-size: 18px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;

      cursor: pointer;

      transition: 0.25s ease;
    }

    .register-button:hover {
      background: #a42b31;

      transform: translateY(-2px);

      box-shadow:
        0 10px 30px rgba(164, 43, 49, 0.25);
    }

    /* =========================
       MENSAJE
    ========================= */

    .message {
      min-height: 20px;

      color: #d65a5a;

      font-size: 13px;

      text-align: center;
    }

    /* =========================
       INICIAR SESIÓN
    ========================= */

    .login-text {
      margin-top: 25px;
      padding-top: 20px;

      border-top: 1px solid rgba(244, 240, 235, 0.1);

      color: rgba(244, 240, 235, 0.55);

      font-size: 13px;

      text-align: center;
    }

    .login-button {
      margin-left: 5px;

      padding: 0;

      background: transparent;

      border: none;

      color: #a42b31;

      font-family: "Work Sans", sans-serif;

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;
    }

    .login-button:hover {
      color: #f4f0eb;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .register-box {
        margin: 20px;

        padding: 35px 25px;
      }

      .title {
        font-size: 40px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

  <div class="register-box">

    <div class="brand-line"></div>

    <p class="eyebrow">CAÓTICCO</p>

    <h1 class="title">
      Crear cuenta
    </h1>

    <p class="description">
      Únete a CAÓTICCO y descubre una nueva forma de vestir,
      transformar y expresar tu identidad.
    </p>


    <form class="register-form" id="registerForm">


      <!-- NOMBRE Y APELLIDO -->

      <div class="form-row">

        <div class="form-field">

          <label for="registerNombre">
            Nombre
          </label>

          <div class="input-wrapper">

            <input
              type="text"
              id="registerNombre"
              placeholder="Tu nombre"
              required
            >

          </div>

        </div>


        <div class="form-field">

          <label for="registerApellido">
            Apellido
          </label>

          <div class="input-wrapper">

            <input
              type="text"
              id="registerApellido"
              placeholder="Tu apellido"
              required
            >

          </div>

        </div>

      </div>


      <!-- TELÉFONO -->

      <div class="form-field">

        <label for="registerTelefono">
          Teléfono
        </label>

        <div class="input-wrapper">

          <input
            type="tel"
            id="registerTelefono"
            placeholder="+57 300 000 0000"
          >

        </div>

      </div>


      <!-- CORREO -->

      <div class="form-field">

        <label for="registerEmail">
          Correo electrónico
        </label>

        <div class="input-wrapper">

          <input
            type="email"
            id="registerEmail"
            placeholder="correo@ejemplo.com"
            required
          >

        </div>

      </div>


      <!-- CONTRASEÑA -->

      <div class="form-field">

        <label for="registerPassword">
          Contraseña
        </label>

        <div class="input-wrapper">

          <input
            type="password"
            id="registerPassword"
            placeholder="Crea una contraseña"
            minlength="6"
            required
          >

          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('registerPassword', this)"
          >
            VER
          </button>

        </div>

      </div>


      <!-- CONFIRMAR CONTRASEÑA -->

      <div class="form-field">

        <label for="registerPasswordConfirm">
          Confirmar contraseña
        </label>

        <div class="input-wrapper">

          <input
            type="password"
            id="registerPasswordConfirm"
            placeholder="Repite tu contraseña"
            minlength="6"
            required
          >

          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('registerPasswordConfirm', this)"
          >
            VER
          </button>

        </div>

      </div>


      <!-- TÉRMINOS -->

      <div class="terms">

        <input
          type="checkbox"
          id="registerTerms"
          required
        >

        <label for="registerTerms">
          Acepto los términos y condiciones de CAÓTICCO.
        </label>

      </div>


      <!-- MENSAJE -->

      <p
        class="message"
        id="registerMessage"
      ></p>


      <!-- BOTÓN -->

      <button
        type="submit"
        class="register-button"
      >
        Crear cuenta
      </button>


    </form>


    <!-- LOGIN -->

    <div class="login-text">

      ¿Ya tienes una cuenta?

      <button
        type="button"
        class="login-button"
        onclick="window.location.href='index2.html'"
      >
        Iniciar sesión
      </button>

    </div>

  </div>


 

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

 <script>
const SUPABASE_URL =
  "https://monucajaypygutvmjcnf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__yJ9MpwrQ5X26RjKWXevGw_dULsKJxM";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("registerForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const nombre =
      document.getElementById("registerNombre").value.trim();

    const apellido =
      document.getElementById("registerApellido").value.trim();

    const telefono =
      document.getElementById("registerTelefono").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    const confirmarPassword =
      document.getElementById("registerPasswordConfirm").value;

    const message =
      document.getElementById("registerMessage");


    if (password !== confirmarPassword) {

      message.style.color = "#d65a5a";

      message.textContent =
        "Las contraseñas no coinciden.";

      return;
    }


    message.style.color = "#f4f0eb";

    message.textContent =
      "Creando tu cuenta...";


    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {
            nombre: nombre,
            apellido: apellido,
            telefono: telefono
          }

        }

      });


    if (error) {

      console.error(error);

      message.style.color = "#d65a5a";

      message.textContent =
        error.message;

      return;
    }


    message.style.color = "#6fbf73";

    message.textContent =
      "¡Cuenta creada correctamente! Revisa tu correo.";

    document
      .getElementById("registerForm")
      .reset();

  });

</script>

  </script>

</body>

</html>
